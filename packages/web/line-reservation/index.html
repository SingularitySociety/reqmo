<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>しまんとバス LINE予約確認</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="lr-shell">
      <section class="lr-hero">
        <p class="lr-eyebrow">Shimanto LINE Reservation</p>
        <h1>LINEで予約を確認</h1>
        <p class="lr-description">
          QRやリンクから友だち追加後、チャットで「予約確認」と送るか、ミニアプリで最新予約を確認できます。
        </p>
        <div class="lr-actions">
          <a id="add-friend-button" class="lr-button lr-button-primary" href="#" target="_blank" rel="noopener">
            友だち追加
          </a>
          <a id="open-miniapp-button" class="lr-button lr-button-secondary" href="#" target="_blank" rel="noopener">
            ミニアプリを開く
          </a>
          <button id="liff-login-button" class="lr-button lr-button-ghost" type="button">
            LINEログイン
          </button>
        </div>
        <p id="status-message" class="lr-status" aria-live="polite"></p>
      </section>

      <section class="lr-card">
        <header class="lr-card-header">
          <h2>LINE連携状態</h2>
          <button id="refresh-session-button" class="lr-link-button" type="button">更新</button>
        </header>
        <dl class="lr-meta">
          <div>
            <dt>LINE User ID</dt>
            <dd id="line-user-id">未取得</dd>
          </div>
          <div>
            <dt>連携ユーザー</dt>
            <dd id="linked-user-name">未連携</dd>
          </div>
        </dl>
      </section>

      <section class="lr-card">
        <header class="lr-card-header">
          <h2>利用者登録（必須）</h2>
        </header>
        <p class="lr-note">
          予約を行うには、名前と電話番号の登録が必要です。初回のみ入力してください。
        </p>
        <p id="registration-status-text" class="lr-note"></p>
        <form id="register-user-form" class="lr-inline-form">
          <input
            id="register-name-input"
            type="text"
            autocomplete="name"
            placeholder="お名前"
            required
          />
          <input
            id="register-phone-input"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="08012345678"
            required
          />
          <button class="lr-button lr-button-primary" type="submit">登録する</button>
        </form>
      </section>

      <section class="lr-card">
        <header class="lr-card-header">
          <h2>新規予約</h2>
        </header>
        <p class="lr-note">
          乗車バス停・降車バス停と希望日時を指定して予約できます。希望時刻は「乗車」か「降車」を選択してください。
        </p>
        <form id="create-reservation-form" class="lr-form-grid">
          <label class="lr-field">
            <span>乗車バス停</span>
            <select id="pickup-stop-select" required>
              <option value="">選択してください</option>
            </select>
          </label>
          <label class="lr-field">
            <span>降車バス停</span>
            <select id="dropoff-stop-select" required>
              <option value="">選択してください</option>
            </select>
          </label>
          <fieldset class="lr-fieldset">
            <legend>希望時刻の基準</legend>
            <label>
              <input type="radio" name="desired-time-mode" value="PICKUP" checked />
              乗車
            </label>
            <label>
              <input type="radio" name="desired-time-mode" value="DROPOFF" />
              降車
            </label>
          </fieldset>
          <label class="lr-field">
            <span>希望日</span>
            <input id="desired-date-input" type="date" required />
          </label>
          <label class="lr-field">
            <span>希望時刻</span>
            <input id="desired-time-input" type="time" step="60" required />
          </label>
          <button id="create-reservation-button" class="lr-button lr-button-primary" type="submit">
            この条件で予約する
          </button>
        </form>
        <p id="reservation-create-message" class="lr-note lr-create-message" aria-live="polite"></p>
      </section>

      <section class="lr-card">
        <header class="lr-card-header">
          <h2>予約一覧</h2>
        </header>
        <p id="summary-text" class="lr-summary">予約情報を読み込み中です。</p>
        <ul id="reservation-list" class="lr-reservation-list"></ul>
      </section>
    </main>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
