<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>しまんとバス 現在地マップ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="lb-shell">
      <section class="lb-hero">
        <p class="lb-eyebrow">SHIMANTO LINE BUS MAP</p>
        <h1>現在のバス位置</h1>
        <p class="lb-description">
          LINEの予約メニューから現在のバス位置を確認できます。地図は15秒ごとに自動更新されます。
        </p>
        <div class="lb-actions">
          <button id="refresh-button" type="button" class="lb-button lb-button-primary">
            今すぐ更新
          </button>
          <button id="fit-button" type="button" class="lb-button lb-button-ghost">
            全車両を表示
          </button>
        </div>
        <p id="status-message" class="lb-status" aria-live="polite"></p>
      </section>

      <section class="lb-layout">
        <article class="lb-card">
          <header class="lb-card-header">
            <h2>車両マップ</h2>
          </header>
          <div id="vehicle-map" class="lb-map" role="img" aria-label="現在のバス位置地図"></div>
        </article>
        <article class="lb-card">
          <header class="lb-card-header">
            <h2>車両一覧</h2>
          </header>
          <ul id="vehicle-list" class="lb-vehicle-list">
            <li class="lb-empty">車両データを読み込み中です。</li>
          </ul>
        </article>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./main.js"></script>
  </body>
</html>
